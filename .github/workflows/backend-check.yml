name: Backend Check

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-check.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-check.yml'
  workflow_dispatch:

jobs:
  backend-check:
    name: Validate backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: npm run check

      - name: Smoke test server boot
        run: |
          cp .env.example .env
          timeout 8s npm start || code=$?
          if [ "${code:-0}" -ne 124 ] && [ "${code:-0}" -ne 0 ]; then
            exit ${code}
          fi
